# =========================================================
# LoveActivities Localization (MiniMessage format)
# Bold tags reduced per style guide
# =========================================================

ru:
  prefix: "<gradient:#FF5E62:#FF9966>LoveActivities</gradient> <dark_gray>»</dark_gray> "

  request_sent: "<gray>Вы бросили вызов игроку <gradient:#00C9FF:#92FE9D>{player}</gradient> на игру <yellow>{game}</yellow>!</gray>"
  request_received: "<gray>Игрок <gradient:#00C9FF:#92FE9D>{player}</gradient> бросает вам вызов на <yellow>{game}</yellow>! <click:run_command:'/активности accept {id}'><hover:show_text:'Принять'><green>[Принять]</green></hover></click> <click:run_command:'/активности deny {id}'><hover:show_text:'Отклонить'><red>[Отклонить]</red></hover></click></gray>"
  request_accepted: "<gray>Вызов принят! Открывается комната ставок...</gray>"
  request_denied: "<gray>Вызов отклонён.</gray>"
  request_expired: "<gray>Время на ответ истекло.</gray>"
  request_cancelled: "<gray>Вызов отменён.</gray>"

  bet_not_enough_money: "<red>Недостаточно средств. Баланс: <yellow>{balance}</yellow></red>"
  bet_refunded: "<gray>Ставка возвращена: <yellow>{amount}</yellow> {currency}</gray>"
  game_started: "<gray>Игра <yellow>{game}</yellow> началась!</gray>"
  game_won: "<green>Победа! Выигрыш: <yellow>{amount}</yellow> {currency}</green>"
  game_lost: "<red>Поражение.</red>"
  game_draw: "<yellow>Ничья. Ставки возвращены.</yellow>"

  npc_refuse_reputation: "<red>С тобой не хотят иметь дел. Улучши репутацию.</red>"
  npc_refuse_chance: "<gray>{npc} отказывается играть сейчас.</gray>"

  autolose_disconnect: "<gray>Игрок {player} отключился — автопоражение.</gray>"
  autolose_distance: "<gray>Слишком далеко от соперника — автопоражение.</gray>"
  autolose_timeout: "<gray>Время хода истекло — автопоражение.</gray>"

  error_generic: "<red>Ошибка. Попробуйте ещё раз.</red>"
  no_permission: "<red>Нет прав.</red>"
  only_players: "<red>Только для игроков.</red>"

